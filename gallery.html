<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的图库 - wuhobin.top</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="css/gallery.css">
</head>
<body>
  <div class="bg-scene" aria-hidden="true"></div>

  <main class="page gallery-page">

      <div class="gallery-grid">

          <img src="images/1.png" alt="图片1" loading="lazy">

        <div class="gallery-item">
          <img src="images/2.png" alt="图片2" loading="lazy">
        </div>
        <div class="gallery-item">
          <img src="images/3.png" alt="图片3" loading="lazy">
        </div>
        <div class="gallery-item">
          <img src="images/4.png" alt="图片4" loading="lazy">
        </div>
        <div class="gallery-item">
          <img src="images/5.png" alt="图片5" loading="lazy">
        </div>
      </div>

      <div class="back-button-container">
        <a href="index.html" class="back-button">
          <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
          <span>返回首页</span>
        </a>
      </div>
    </section>
  </main>

</html>
